[package]
name = "downloaderx"
version = "0.5.5"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
axum = "0.8.9"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors"] }
url = "2.5.8"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(windows)'.dependencies]
png = "0.18"
tao = "0.37"
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading"] }
wry = "0.57"

[build-dependencies]
embed-resource = "3"
